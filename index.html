<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I Always Win</title>
<meta name="description" content="Щоденна система перемог: звички, плани, записник, фінанси, цілі.">
<meta name="theme-color" content="#0F1110">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I Always Win">
<style>body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark rounded sidebar panel beside a light-grey editorial canvas; big tight grotesque headings, rounded cards, pill controls, one muted mint accent. */
:root{
  --bg:#E7E9E7; --surface:#F6F7F5; --surface-2:#EEF0EE; --ink:#101211; --muted:#868C89; --line:#D6DAD7;
  --panel:#0F1110; --panel-fg:#F1F3F1; --panel-muted:#7E8481; --panel-line:#262928;
  --mint:#BFE3D2; --mint-ink:#1E4A37; --danger:#B4412F; --on-ink:#F6F7F5;
  --f-display:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-card:28px; --r-sm:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0C; --surface:#161817; --surface-2:#1E2120; --ink:#ECEFED; --muted:#7D8481; --line:#2A2E2C;
  --panel:#161817; --panel-fg:#ECEFED; --panel-muted:#7D8481; --panel-line:#2A2E2C;
  --mint:#A6D6C0; --mint-ink:#123526; --danger:#E0745F; --on-ink:#0F1110; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0C; --surface:#161817; --surface-2:#1E2120; --ink:#ECEFED; --muted:#7D8481; --line:#2A2E2C;
  --panel:#161817; --panel-fg:#ECEFED; --panel-muted:#7D8481; --panel-line:#2A2E2C;
  --mint:#A6D6C0; --mint-ink:#123526; --danger:#E0745F; --on-ink:#0F1110; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;min-height:100%;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{background:var(--panel);color:var(--panel-fg);border-radius:var(--r-card);padding:24px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:16px;height:calc(100vh - 32px);min-height:520px}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:.92;letter-spacing:-.045em;text-transform:uppercase;padding-inline:8px}
.brand span{color:var(--panel-muted)}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;text-transform:none;color:var(--panel-muted);margin-top:10px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--panel-muted);padding:11px 12px;border-radius:999px;font-weight:500;text-align:left;font-size:15px}
.nav button:hover{color:var(--panel-fg);background:var(--panel-line)}
.nav button[aria-current="page"]{background:var(--panel-fg);color:var(--panel)}
.nav svg{width:20px;height:20px;flex:none}
.nav .sm{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-inline:8px}
.today-card{border:1px solid var(--panel-line);border-radius:20px;padding:14px}
.today-card .d{font-family:var(--f-display);font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1}
.today-card .m{color:var(--panel-muted);font-size:13px;margin-top:6px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--panel-muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--panel-muted);display:inline-block}
.sync.ok i{background:var(--mint)}
.sync.bad i{background:var(--danger)}

main{min-width:0;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding:20px 8px 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(44px,7vw,96px);line-height:.9;letter-spacing:-.05em;margin:10px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.03em;margin:0;line-height:1.1}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0;line-height:1.2}
.card{background:var(--surface);border-radius:var(--r-card);padding:22px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:10px 10px 10px 18px;background:var(--ink);color:var(--on-ink);font-weight:500;white-space:nowrap}
.btn .ar{width:28px;height:28px;border-radius:50%;background:var(--on-ink);color:var(--ink);display:grid;place-items:center}
.btn .ar svg{width:14px;height:14px}
.btn.plain{padding:10px 18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 16px}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line);padding:9px 16px}
.btn.danger.armed{background:var(--danger);color:var(--on-ink);border-color:var(--danger)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.quiet{border-color:transparent;color:var(--muted)}
.icon-btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea,select{
  width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:11px 14px;outline:none;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:180px;line-height:1.55}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* home */
.monthbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px}
.monthpill b{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;min-width:140px;text-align:center;font-size:16px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
.day{flex:none;width:56px;border:0;border-radius:20px;background:var(--surface);padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:center;position:relative}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.03em}
.day:hover{background:var(--surface-2)}
.day.sel:hover{background:var(--ink)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.day.sel{background:var(--ink);color:var(--on-ink)}
.day.sel small{color:var(--on-ink);opacity:.7}
.day.weekend:not(.sel) b{color:var(--muted)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--mint-ink);opacity:.8}
.day.sel .dot{background:var(--mint)}
.day .dot.none{visibility:hidden}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.progress{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.progress .big{font-family:var(--f-display);font-size:64px;font-weight:600;letter-spacing:-.05em;line-height:.9}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1;min-width:140px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .3s}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent}
.check:hover{border-color:var(--ink)}
.check.on{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.check svg{width:14px;height:14px}
.emo{font-size:20px;width:28px;text-align:center;flex:none}
.time{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;flex:none}
.addrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.addrow input[type=text]{flex:1 1 180px}
.addrow input[type=time]{width:120px;flex:none}
.empty{color:var(--muted);padding:18px 0;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.warn{background:transparent;box-shadow:inset 0 0 0 1px var(--danger);color:var(--danger)}
.goal.achieved .tag{background:rgba(255,255,255,.45);color:var(--mint-ink)}
.tag.mint{background:var(--mint);color:var(--mint-ink)}

/* habits */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.habit{display:flex;flex-direction:column;gap:16px}
.habit .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.habit .bigemo{font-size:34px;line-height:1}
.habit .count{font-family:var(--f-display);font-weight:600;font-size:76px;letter-spacing:-.06em;line-height:.85}
.habit .count small{font-size:18px;letter-spacing:-.01em;color:var(--muted);margin-left:6px;font-weight:500}
.dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.dots i{height:16px;border-radius:5px;background:var(--surface-2)}
.dots i.on{background:var(--mint)}
.dots i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}

/* notes */
.notes{columns:3 260px;column-gap:16px}
.note{break-inside:avoid;margin-bottom:16px;position:relative;padding:18px 18px 14px;transition:box-shadow .15s}
.note:focus-within{box-shadow:0 0 0 1.5px var(--ink)}
.note-text{display:block;width:100%;border:0!important;background:transparent!important;padding:0 96px 0 0!important;min-height:0!important;resize:none;overflow:hidden;font-size:16px;line-height:1.55;color:inherit;border-radius:0!important}
.note-text:first-line{font-weight:600}
.note-text::placeholder{color:var(--muted)}
.note-tools{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.nt{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;opacity:.55;transition:opacity .15s,background-color .15s,color .15s}
.nt svg{width:16px;height:16px}
.note:hover .nt,.note:focus-within .nt,.nt.on{opacity:1}
.nt:hover{background:var(--surface-2);color:var(--ink)}
.nt.on{color:var(--mint-ink)}
.note-date{margin-top:12px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.note.pinned{background:var(--mint);color:var(--mint-ink)}
.note.pinned .note-date,.note.pinned .nt{color:var(--mint-ink)}
.note.pinned .nt:hover{background:rgba(255,255,255,.4)}
.note.pinned .note-text::placeholder{color:var(--mint-ink);opacity:.6}
/* note groups */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:24px 20px;position:relative}
.book{position:relative;aspect-ratio:3/4;border:0;padding:0;background:transparent;cursor:pointer;text-align:left;color:inherit;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.book .pages{position:absolute;right:0;top:7px;bottom:7px;width:20px;border-radius:0 7px 7px 0;background:repeating-linear-gradient(to bottom,#F3F1EA 0 2px,#D9D5CA 2px 3px);box-shadow:0 8px 18px -10px rgba(0,0,0,.35)}
.book .cover{position:absolute;inset:0 7px 0 0;background:var(--bc);color:var(--bf);border-radius:5px 16px 16px 5px;padding:16px 14px 14px 28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 14px 28px -16px rgba(0,0,0,.5)}
.book .cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,.08));box-shadow:inset -1px 0 0 rgba(255,255,255,.14)}
.book .cover::after{content:'';position:absolute;left:17px;top:0;bottom:0;width:1.5px;background:rgba(0,0,0,.14)}
.book .bno{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;opacity:.6}
.book .bt{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2.1vw,24px);letter-spacing:-.035em;line-height:1.02;margin-top:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.book .bt.sm{font-size:clamp(17px,1.75vw,20px)}.book .bt.xs{font-size:clamp(14px,1.4vw,16px)}
.book .brule{width:28px;height:2px;background:currentColor;opacity:.35;margin-top:12px;border-radius:2px}
.book .bfoot{margin-top:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
@media (hover:hover){.book:not(.add):hover{transform:translateY(-5px) rotate(-.8deg)}}
.book:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:14px}
.book.dragging{z-index:5;transition:none;cursor:grabbing}
.book.dragging .cover{box-shadow:0 26px 40px -18px rgba(0,0,0,.6)}
.shelf.sorting .book:not(.dragging){transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.book.add .cover{background:transparent;color:var(--ink);border:1.5px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center}
.book.add .cover::before,.book.add .cover::after{display:none}
.book.add .plus{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.book.add .plus svg{width:16px;height:16px}
.book.add b{font-family:var(--f-display);font-size:16px;font-weight:600}
.shelf-hint{font-size:13px;color:var(--muted);margin:2px 4px 0}
.book-pre{width:112px;flex:none;pointer-events:none}
.book-pre{width:120px}.book-pre .bt{font-size:16px}.book-pre .bt.sm{font-size:14px}.book-pre .bt.xs{font-size:12px}
.color-picks{display:flex;flex-wrap:wrap;gap:8px}
.color-picks button{width:34px;height:34px;border-radius:50%;border:0;background:var(--bc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative}
.color-picks button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.bdot{display:inline-block;width:.5em;height:.68em;border-radius:3px 6px 6px 3px;background:var(--bc);margin-right:.22em;vertical-align:.02em;box-shadow:inset 3px 0 0 rgba(0,0,0,.2)}
.crumb{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);border-radius:999px;padding:7px 14px 7px 8px;color:var(--muted);font-weight:500}
.crumb:hover{color:var(--ink)}
.crumb svg{width:16px;height:16px}
.nt.move{position:relative;cursor:pointer}
.nt.move select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;padding:0}
.reset-opt{cursor:pointer;align-items:flex-start}
.reset-opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.reset-opt .tag{flex:none;margin-top:2px}
.confirm-box{margin-top:16px;border:1.5px solid var(--danger);border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.confirm-box b{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav button.bottom{margin-top:14px;position:relative}.nav button.bottom::before{content:'';position:absolute;left:12px;right:12px;top:-9px;border-top:1px solid var(--panel-line)}
@media (max-width:820px){.nav button.bottom{margin-top:0}.nav button.bottom::before{display:none}}
.note-empty{display:flex;gap:16px;align-items:center;text-align:left;border:1.5px dashed var(--line);background:transparent;cursor:pointer;width:100%;color:var(--ink)}
.note-empty:hover{border-color:var(--ink)}
.note-empty .plus{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.note-empty .plus svg{width:18px;height:18px}
@media (hover:none){.nt{opacity:1}}

/* finance */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.04em;line-height:1;margin-top:10px;overflow-wrap:anywhere}
.kpi.dark{background:var(--ink);color:var(--on-ink)}
.kpi.dark .muted{color:var(--on-ink);opacity:.6}
.tx-day{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}
.tx-day:first-child{padding-top:0}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--mint-ink);background:var(--mint);padding:2px 10px;border-radius:999px}
.item.click{cursor:pointer}
.item.click:hover .txt b{text-decoration:underline}
.catbar{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catbar:first-child{border-top:0}
.catbar .track{grid-column:2/4;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.catbar .track i{display:block;height:100%;background:var(--ink);border-radius:999px}
.catbar.inc .track i{background:var(--mint-ink)}
.rep-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.emoji-picks{display:flex;flex-wrap:wrap;gap:4px}
.emoji-picks button{width:38px;height:38px;border-radius:12px;border:1px solid transparent;background:var(--surface-2);font-size:19px;line-height:1}
.emoji-picks button[aria-pressed="true"]{border-color:var(--ink)}

/* goals */

(function(){
  var el=document.getElementById('boot'); if(!el) return;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers=[];
  function finish(){ if(el.classList.contains('out')) return; timers.forEach(clearTimeout); el.classList.add('out'); document.removeEventListener('keydown',onKey); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 1000); }
  function onKey(e){ if(e.key==='Escape'||e.key==='Enter'||e.key===' ') finish(); }
  if(reduce){ el.parentNode.removeChild(el); return; }
  var cuts=el.querySelectorAll('.bc');
  requestAnimationFrame(function(){ el.classList.add('run'); });
  [100,1050,2000,2950].forEach(function(ms,i){ timers.push(setTimeout(function(){ cuts[i].classList.add('on'); if(i>1) cuts[i-2].classList.add('gone'); }, ms)); });
  timers.push(setTimeout(finish, 4700));
  document.getElementById('boot-skip').addEventListener('click', function(e){ e.stopPropagation(); finish(); });
  el.addEventListener('click', finish);
  document.addEventListener('keydown', onKey);
})();

    if(!r.ok) throw new Error('http '+r.status);

  });
}
function cloudStatus(st, err){ store.sync = st; CLOUD.err = err||''; emit(); }
async function syncNow(){
  if(!CLOUD.code) return;
  if(CLOUD.busy){ CLOUD.again = true; return; }
  if(navigator.onLine===false){ cloudStatus('offline'); return; }
  CLOUD.busy = true; if(store.sync!=='synced') cloudStatus('connecting');
  try{
    const imgs = new Set(lsGet('sync:imgs') || []);
    let merged, startLocal;
    for(let attempt=0;;attempt++){
      const {state:remote, etag} = await (await cloudReq('/api/sync')).json();
      startLocal = stripState(store.state);
      const base = lsGet('sync:base') || {};
      merged = {};
      SECTIONS.forEach(sec => {
        const l = startLocal[sec], r = remote ? remote[sec] : undefined;
        merged[sec] = r===undefined ? l : merge3(base[sec], l, r);
      });
      // upload photos this device has and the cloud does not
      for(const d of store.state.dreams){
        if(d.src && !imgs.has(d.id) && merged.dreams.some(x=>x.id===d.id)){
          await cloudReq('/api/img?id='+encodeURIComponent(d.id), {method:'PUT', body:d.src});
          imgs.add(d.id); lsSet('sync:imgs', [...imgs]);
        }
      }
      if(remote && eq(merged, remote)) break;
      try{ await cloudReq('/api/sync', {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({state:merged, etag})}); break; }
      catch(e){ if(e.code!=='conflict' || attempt>=3) throw e; }
    }
    // apply to this device, keeping anything typed while we were syncing
    const nowLocal = stripState(store.state);
    const srcOf = new Map(store.state.dreams.filter(d=>d.src).map(d=>[d.id,d.src]));
    let changed = false; const next = {...store.state};
    SECTIONS.forEach(sec => {
      let v = merge3(startLocal[sec], nowLocal[sec], merged[sec]);
      if(sec==='dreams') v = v.map(d=>{ const s=srcOf.get(d.id); if(s){ const {img,...rest}=d; return {...rest, src:s}; } return d; });
      if(!eq(v, store.state[sec])){ next[sec]=v; changed=true; lsSet(sec, v); store.at[sec]=Date.now(); lsSet('at:'+sec, store.at[sec]); }
    });
    if(changed){ store.state = next; }
    lsSet('sync:base', merged);
    CLOUD.last = Date.now(); lsSet('sync:last', CLOUD.last);
    cloudStatus('synced');
    fetchMissingImages();
  }catch(e){
    cloudStatus(navigator.onLine===false ? 'offline' : 'error', String(e && e.message || e));
  }
  CLOUD.busy = false;
  if(CLOUD.again){ CLOUD.again=false; setTimeout(syncNow, 300); }
}
async function fetchMissingImages(){
  const need = store.state.dreams.filter(d=>d.img && !d.src && !d.asset);
  for(const d of need){
    try{
      const src = await (await cloudReq('/api/img?id='+encodeURIComponent(d.id))).text();
      const imgs = new Set(lsGet('sync:imgs') || []); imgs.add(d.id); lsSet('sync:imgs',[...imgs]);
      const v = store.state.dreams.map(x=>x.id===d.id ? (()=>{ const {img,...rest}=x; return {...rest, src}; })() : x);
      store.state = {...store.state, dreams:v}; lsSet('dreams', v); emit();
    }catch(e){}
  }
}
function scheduleSync(ms){ if(!CLOUD.code) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(syncNow, ms==null?1500:ms); }
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newSyncCode(){
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  const s = Array.from(b, x=>CODE_ABC[x%32]).join('');
  return s.match(/.{4}/g).join('-');
}
function cleanCode(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').match(/.{1,4}/g)?.join('-') || ''; }
async function connectSync(code){
  CLOUD.code = cleanCode(code); lsSet('sync:code', CLOUD.code);
  localStorage.removeItem(LS+'sync:base');   // first link: merge everything, delete nothing
  await syncNow();
  return store.sync==='synced';
}
function disconnectSync(){
  CLOUD.code=''; clearTimeout(CLOUD.timer);
  ['sync:code','sync:base','sync:imgs','sync:last'].forEach(k=>{ try{ localStorage.removeItem(LS+k); }catch(e){} });
  cloudStatus('local');
}
function initCloud(){
  if(!CLOUD.code || location.protocol==='file:') return;
  if(window.claude && typeof window.claude.use==='function') return;
  syncNow();
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') scheduleSync(100); else syncNow(); });
  window.addEventListener('focus', ()=>scheduleSync(100));
  window.addEventListener('online', ()=>scheduleSync(100));
  setInterval(()=>{ if(document.visibilityState==='visible') syncNow(); }, 30000);
}

function useStore(){
  const [,force] = useState(0);
  useEffect(()=>{ const f=()=>force(x=>x+1); store.listeners.add(f); return ()=>store.listeners.delete(f); },[]);
  return store.state;
}

function undoable(text, sec, updater, onExpire){

/* ---------- Habits ---------- */
function Habits({s}){
  const [form,setForm] = useState(null);
  const [kind,setKindRaw] = useState(()=>lsGet('ui:habitKind')==='bad'?'bad':'good');
  const setKind = k => { setKindRaw(k); lsSet('ui:habitKind',k); };
  const tk = todayKey();
  const save = h => { setSection('habits', list => list.some(x=>x.id===h.id) ? list.map(x=>x.id===h.id?h:x) : [...list,h]); if(h.kind!==kind) setKind(h.kind); setForm(null); };
  const remove = id => { undoable('Звичку видалено','habits', list=>list.filter(x=>x.id!==id)); setForm(null); };
  const toggleToday = id => setSection('checks', c => { const day={...(c[tk]||{})}; if(day[id]) delete day[id]; else day[id]=true; const n={...c}; if(Object.keys(day).length) n[tk]=day; else delete n[tk]; return n; });
  const relapse = h => undoable('Лічильник «'+h.name+'» почато заново','habits', list=>list.map(x=>{ if(x.id!==h.id) return x; const run=Math.max(0,daysBetween(x.since||tk,tk)); return {...x, since:tk, best:Math.max(x.best||0,run), relapses:(x.relapses||0)+1}; }));
  const isBad = h => h.kind==='bad';
  const good = s.habits.filter(h=>!isBad(h)), bad = s.habits.filter(isBad);
  const list = (kind==='bad'?bad:good).slice().sort((a,b)=>(a.since||'').localeCompare(b.since||''));

function Shelf({groups,count,onOpen,onAdd,onReorder}){
  const [order,setOrder] = useState(null);
  const [dragId,setDragId] = useState(null);
  const S = useRef({}); const wrap = useRef(null);
  const byId = Object.fromEntries(groups.map(g=>[g.id,g]));
  const ids = (order||groups.map(g=>g.id)).filter(id=>byId[id]);
  const place = () => { const s=S.current; if(!s.active||!wrap.current) return; const el=wrap.current.querySelector('[data-book="'+s.id+'"]'); if(!el) return;
    const w=wrap.current.getBoundingClientRect(); el.style.transform='translate('+(s.px-w.left-s.gx-el.offsetLeft)+'px,'+(s.py-w.top-s.gy-el.offsetTop)+'px) rotate(-2deg) scale(1.04)'; };
  useLayoutEffect(place);
  const reset = () => { const s=S.current; clearTimeout(s.t); if(wrap.current) wrap.current.querySelectorAll('[data-book]').forEach(e=>e.style.transform=''); S.current={justDragged:s.active&&s.moved}; setDragId(null); setOrder(null); };
  const start = () => { const s=S.current; if(s.active||!s.id||!s.el) return; const r=s.el.getBoundingClientRect(); s.gx=s.x0-r.left; s.gy=s.y0-r.top; s.px=s.x0; s.py=s.y0; s.active=true; s.order=groups.map(g=>g.id); setOrder(s.order); setDragId(s.id); try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} };
  useEffect(()=>{
    const tm = e => { if(S.current.active) e.preventDefault(); };
    const mv = e => { const s=S.current; if(!s.id || e.pointerId!==s.pid) return;
      if(!s.active){ if(Math.hypot(e.clientX-s.x0,e.clientY-s.y0)<8) return; if(e.pointerType==='mouse') start(); else { clearTimeout(s.t); S.current={}; return; } }
      s.moved=true; s.px=e.clientX; s.py=e.clientY;
      const t=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('[data-book]')).find(n=>n && n.dataset.book!==s.id);
      if(t){ const from=s.order.indexOf(s.id), to=s.order.indexOf(t.dataset.book); if(to>-1 && from!==to){ const o=s.order.filter(x=>x!==s.id); o.splice(to,0,s.id); s.order=o; setOrder(o); return; } }
      place(); };
    const up = e => { const s=S.current; if(!s.id || e.pointerId!==s.pid) return; if(s.active && s.moved && s.order.join()!==groups.map(g=>g.id).join()) onReorder(s.order); reset(); setTimeout(()=>{ S.current.justDragged=false; },0); };
    const cancel = e => { const s=S.current; if(s.id && e.pointerId===s.pid) reset(); };
    document.addEventListener('touchmove',tm,{passive:false}); window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',cancel);
    return ()=>{ document.removeEventListener('touchmove',tm); window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',cancel); };
  },[groups,onReorder]);
  const down = (e,id) => { if(e.button>0) return; const s={id,pid:e.pointerId,x0:e.clientX,y0:e.clientY,el:e.currentTarget,active:false,moved:false}; S.current=s; if(e.pointerType!=='mouse') s.t=setTimeout(start,320); };
  const move = (id,dir) => { const o=groups.map(g=>g.id); const i=o.indexOf(id), j=i+dir; if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; onReorder(o); setTimeout(()=>{ const el=wrap.current && wrap.current.querySelector('[data-book="'+id+'"]'); el && el.focus(); },30); };
  return html`<div class=${'shelf'+(dragId?' sorting':'')} ref=${wrap}>
    ${ids.map((id,i)=>{ const g=byId[id]; return html`<button key=${id} data-book=${id} class=${'book'+(dragId===id?' dragging':'')} aria-label=${g.name+', '+count(id)+' '+plural(count(id),'запис','записи','записів')+'. Alt + стрілка, щоб перемістити'}
      onPointerDown=${e=>down(e,id)} onContextMenu=${e=>e.preventDefault()} onClick=${()=>{ if(S.current.justDragged||S.current.active) return; onOpen(id); }}
      onKeyDown=${e=>{ if(e.altKey && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); move(id,e.key==='ArrowLeft'?-1:1); } }}>
      <${BookFace} g=${g} no=${i+1} n=${count(id)}/>
    </button>`; })}
    <button class="book add" onClick=${onAdd}><span class="cover"><span class="plus">${I.plus()}</span><b>Нова книжка</b></span></button>
  </div>`;
}

    ${cards}

function NoteCard({n, groups, autoFocus, onSave, onBlurEmpty, onPin, onMove, onDelete, onFocused}){

    </div>

      onFocus=${()=>{ editing.current=true; }}
      onInput=${e=>{ const v=e.target.value; setText(v); clearTimeout(timer.current); timer.current=setTimeout(()=>commit(v),700); }}
      onBlur=${e=>{ editing.current=false; const v=e.target.value; if(!v.trim()) onBlurEmpty(); else commit(v); }}></textarea>

  </article>`;
}

function compact(v){ if(v>=1e6) return nf.format(Math.round(v/1e5)/10)+'м'; if(v>=1e3) return nf.format(Math.round(v/100)/10)+'к'; return nf.format(v); }

function Report({tx, catById, months}){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-(months-1), 1);
  const startKey = keyOf(start), endKey = todayKey();
  const list = tx.filter(t=>t.date>=startKey && t.date<=endKey);
  const totIn = list.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const totOut = list.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const byCat = type => { const m={}; list.filter(t=>t.type===type).forEach(t=>{ m[t.catId]=(m[t.catId]||0)+t.amount; });
    return Object.entries(m).map(([id,v])=>({id,v,c:catById[id]})).sort((a,b)=>b.v-a.v); };
  const outCats = byCat('expense'), inCats = byCat('income');
  const mList = Array.from({length:months},(_,i)=>{ const d=new Date(start.getFullYear(), start.getMonth()+i, 1); const p=d.getFullYear()+'-'+pad(d.getMonth()+1);
    const ml=list.filter(t=>t.date.startsWith(p)); return {label:MONTHS_SHORT[d.getMonth()], inc:ml.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0), out:ml.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0)}; });
  const max = niceCeil(Math.max(1,...mList.map(m=>Math.max(m.inc,m.out))));
  const W=680, H=240, L=52, B=28, T=12, R=8; const cw=(W-L-R)/months; const bw=Math.min(22,cw*0.32);
  const y = v => T + (H-T-B) * (1 - v/max);
  const avg = totOut / months;
  const CatList = ({items,total,inc}) => html`<div>${items.length===0 && html`<div class="empty">За цей період записів немає.</div>`}
    ${items.map(({id,v,c})=>html`<div key=${id} class=${'catbar'+(inc?' inc':'')}><span class="emo">${c?c.emoji:'❔'}</span><span style=${{minWidth:0,overflowWrap:'anywhere'}}>${c?c.name:'Без категорії'} <span class="muted small num">${Math.round(v/total*100)}%</span></span><span class="amt">${money(v)}</span><div class="track"><i style=${{width:(v/total*100)+'%'}}></i></div></div>`)}</div>`;
  return html`<${React.Fragment}>
    <div class="kpis">
      <div class="card kpi"><div class="muted small">Доходи · ${humanShort(startKey)} — ${humanShort(endKey)}</div><div class="v num">${money(totIn)}</div></div>
      <div class="card kpi"><div class="muted small">Витрати · в середньому ${money(avg)} на місяць</div><div class="v num">${money(totOut)}</div></div>
      <div class="card kpi dark"><div class="muted small">Різниця за період</div><div class="v num">${(totIn-totOut<0?'−':'')+money(Math.abs(totIn-totOut))}</div></div>
    </div>
    <section class="card">
      <div class="card-head"><h2>По місяцях</h2><div class="legend"><span><i style=${{background:'var(--ink)'}}></i>Витрати</span><span><i style=${{background:'var(--mint)'}}></i>Доходи</span></div></div>
      <div style=${{overflowX:'auto'}}><svg class="chart" viewBox=${'0 0 '+W+' '+H} role="img" aria-label="Доходи і витрати по місяцях" style=${{minWidth:'420px'}}>
        ${[0,.25,.5,.75,1].map(f=>html`<g key=${f}><line x1=${L} x2=${W-R} y1=${y(max*f)} y2=${y(max*f)} stroke="var(--line)" stroke-width="1"/><text x=${L-8} y=${y(max*f)+4} text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${compact(max*f)}</text></g>`)}
        ${mList.map((m,i)=>{ const cx=L+cw*i+cw/2; return html`<g key=${i}>
          <rect x=${cx-bw-2} y=${y(m.out)} width=${bw} height=${Math.max(0,H-B-y(m.out))} rx="5" fill="var(--ink)"><title>${'Витрати: '+money(m.out)}</title></rect>
          <rect x=${cx+2} y=${y(m.inc)} width=${bw} height=${Math.max(0,H-B-y(m.inc))} rx="5" fill="var(--mint)"><title>${'Доходи: '+money(m.inc)}</title></rect>
          <text x=${cx} y=${H-8} text-anchor="middle" font-size="12" fill="var(--muted)">${m.label}</text></g>`; })}
      </svg></div>
    </section>
    <div class="rep-grid">
      <section class="card"><div class="card-head"><h2>На що пішли гроші</h2><span class="muted small num">${money(totOut)}</span></div><${CatList} items=${outCats} total=${totOut||1}/></section>
      <section class="card"><div class="card-head"><h2>Звідки прийшли</h2><span class="muted small num">${money(totIn)}</span></div><${CatList} items=${inCats} total=${totIn||1} inc=${true}/></section>
    </div>
  </${React.Fragment}>`;
}

function goalPct(g){ if(g.done) return 100; if(g.steps && g.steps.length) return Math.round(g.steps.filter(x=>x.done).length/g.steps.length*100); return g.progress||0; }

    <div class="grid-cards">

          <div class="row" style=${{justifyContent:'space-between',alignItems:'flex-start',flexWrap:'nowrap'}}><h3 style=${{overflowWrap:'anywhere'}}>${g.title}</h3><button class="icon-btn quiet" aria-label="Редагувати" onClick=${()=>setForm(clone(g))}>${I.edit()}</button></div>

          ${g.steps && g.steps.length>0 && html`<div class="list">${g.steps.map(st=>html`<div key=${st.id} class=${'item'+(st.done?' done':'')}>
            <button class=${'check'+(st.done?' on':'')} aria-pressed=${st.done} aria-label=${'Крок: '+st.text} onClick=${()=>patch(g.id,x=>({...x,steps:x.steps.map(y=>y.id===st.id?{...y,done:!y.done}:y)}))}>${I.check()}</button><span class="txt">${st.text}</span></div>`)}</div>`}
          <div class="row">${g.done
            ? html`<${Btn} kind="ghost" onClick=${()=>patch(g.id,x=>({...x,done:false}))}>Повернути в роботу</${Btn}>`

function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=> b ? res({blob:b, canvas:c}) : rej(new Error('encode')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
const dreamSrc = d => d.asset ? '/_blob/'+d.asset : d.src;

      <div style=${{minWidth:0}}><h3>Перетягніть сюди фото, які надихають</h3><div class="muted small">Будинок, авто, подорожі, форма, люди, якими захоплюєтесь. ${cloud?'Фото зберігаються у вашому акаунті.':'Зараз фото зберігаються тільки в цьому браузері.'}</div></div>
      <${Btn} kind="ghost" onClick=${()=>inputRef.current && inputRef.current.click()}>Обрати файли</${Btn}>

    ${err && html`<p style=${{color:'var(--danger)',margin:0}}>${err}</p>`}

    <div class="gallery">
      ${Array.from({length:busy}).map((_,i)=>html`<div key=${'b'+i} class="shot busy">Завантажую…</div>`)}
      ${s.dreams.map(d=>html`<button key=${d.id} class="shot" onClick=${()=>setOpen(d)} aria-label=${d.caption||'Фото мрії'}>

function exportBackup(){
  const data = {app:'i-always-win', version:1, exported:new Date().toISOString(), state:store.state};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'i-always-win-'+todayKey()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importBackup(file, done){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result); const st = d && (d.state || d);
      const secs = SECTIONS.filter(k => st && st[k] !== undefined);
      if(!secs.length) throw 0;
      finishToast();
      const prev = Object.fromEntries(secs.map(k=>[k,store.state[k]]));
      secs.forEach(k => setSection(k, st[k]));
      store.toast = {text:'Дані відновлено з файлу', undo:()=>{ store.toast=null; clearTimeout(store.toastT); secs.forEach(k=>setSection(k, prev[k])); }};
      clearTimeout(store.toastT); store.toastT = setTimeout(()=>{ finishToast(); emit(); }, 10000);
      emit(); done('');
    }catch(e){ done('Цей файл не схожий на резервну копію I Always Win.'); }
  };
  r.onerror = () => done('Не вдалося прочитати файл.');
  r.readAsText(file);
}
function SyncCard(){

      ${mode!=='join' ? html`<div class="row" style=${{marginTop:'16px'}}>
          <${Btn} arrow disabled=${busy} onClick=${()=>start(newSyncCode())}>${busy?'Підключаю…':'Увімкнути синхронізацію'}</${Btn}>

        </div>`
      : html`<form class="row" style=${{marginTop:'16px'}} onSubmit=${e=>{ e.preventDefault(); const c=cleanCode(input); if(c.replace(/-/g,'').length<16){ setMsg('Код має 16 символів, наприклад ABCD-EFGH-JKLM-NPQR.'); return; } start(c); }}>
          <input id="sync-code" type="text" placeholder="ABCD-EFGH-JKLM-NPQR" autocomplete="off" autocapitalize="characters" spellcheck="false" value=${input} onInput=${e=>setInput(e.target.value)} style=${{flex:'1 1 220px',fontFamily:'monospace',letterSpacing:'.08em'}}/>
          <${Btn} type="submit" disabled=${busy}>${busy?'Підключаю…':'Підключити'}</${Btn}>
          <${Btn} kind="ghost" onClick=${()=>{ setMode(''); setMsg(''); }}>Скасувати</${Btn}>
        </form>`}
    ` : html`
      <p class="muted" style=${{margin:0}}>${store.sync==='error' ? 'Зараз не вдалося звʼязатися з хмарою. Дані збережені на цьому пристрої, спробую ще раз автоматично.' : 'Зміни на цьому пристрої автоматично зʼявляються на інших, де введено цей код.'}${when ? ' Остання синхронізація: '+when+'.' : ''}</p>
